<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Dourados</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1B0"/>
      <stop offset=".25" stop-color="#D4AF37"/>
      <stop offset=".5" stop-color="#8F6B14"/>
      <stop offset=".75" stop-color="#E8C65A"/>
      <stop offset="1" stop-color="#9A7218"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A7218"/>
      <stop offset=".35" stop-color="#F3D774"/>
      <stop offset=".5" stop-color="#FFF1B0"/>
      <stop offset=".7" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8A6410"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#1E1B12"/>
      <stop offset="1" stop-color="#121212"/>
    </radialGradient>
    <pattern id="brush" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="3" fill="#000" opacity=".12"/>
      <rect x="1.5" width=".5" height="3" fill="#fff" opacity=".1"/>
    </pattern>
    <path id="shield" d="M96 140Q256 90 416 140V290C416 390 330 450 256 482C182 450 96 390 96 290Z"/>
    <path id="leaf" d="M256 205C310 260 320 360 256 445C192 360 202 260 256 205Z"/>
    <path id="arc" d="M128 185Q256 141 384 185"/>
    <clipPath id="sc"><use href="#shield"/></clipPath>
    <symbol id="s" overflow="visible">
      <path d="M0-1Q0 0 1 0Q0 0 0 1Q0 0-1 0Q0 0 0-1Z"/>
    </symbol>
  </defs>

  <!-- Fundo superellipse -->
  <rect width="512" height="512" rx="115" fill="#121212"/>

  <!-- Escudo -->
  <use href="#shield" fill="url(#bg)"/>

  <!-- Estrelas -->
  <g clip-path="url(#sc)" fill="#E8C65A">
    <use href="#s" transform="translate(140 230) scale(6)"/>
    <use href="#s" transform="translate(372 226) scale(5)"/>
    <use href="#s" transform="translate(175 285) scale(4)"/>
    <use href="#s" transform="translate(340 290) scale(7)"/>
    <use href="#s" transform="translate(130 335) scale(4)"/>
    <use href="#s" transform="translate(385 345) scale(5)"/>
    <use href="#s" transform="translate(160 390) scale(6)"/>
    <use href="#s" transform="translate(355 395) scale(4)"/>
    <use href="#s" transform="translate(215 440) scale(4)"/>
    <use href="#s" transform="translate(292 448) scale(3)"/>
    <use href="#s" transform="translate(190 210) scale(3)"/>
    <use href="#s" transform="translate(325 212) scale(4)"/>
    <use href="#s" transform="translate(118 282) scale(3)"/>
    <use href="#s" transform="translate(396 288) scale(3)"/>
    <circle cx="205" cy="260" r="1.6"/><circle cx="310" cy="250" r="1.4"/>
    <circle cx="150" cy="310" r="1.5"/><circle cx="365" cy="320" r="1.6"/>
    <circle cx="200" cy="360" r="1.4"/><circle cx="318" cy="372" r="1.5"/>
    <circle cx="245" cy="468" r="1.3"/><circle cx="275" cy="230" r="1.3"/>
    <circle cx="112" cy="250" r="1.4"/><circle cx="402" cy="252" r="1.4"/>
  </g>

  <!-- Moldura dourada -->
  <use href="#shield" fill="none" stroke="url(#g)" stroke-width="10" stroke-linejoin="round"/>
  <use href="#shield" fill="none" stroke="#FFF1B0" stroke-width="1.5" opacity=".6"
       transform="translate(256 290) scale(.93) translate(-256 -290)"/>

  <!-- Nome -->
  <text font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700"
        letter-spacing="5" fill="url(#g)" stroke="#5A3F08" stroke-width=".6" text-anchor="middle">
    <textPath href="#arc" startOffset="50%">DOURADOS</textPath>
  </text>

  <!-- Folha -->
  <g>
    <use href="#leaf" fill="url(#l)"/>
    <use href="#leaf" fill="url(#brush)"/>
    <use href="#leaf" fill="none" stroke="#FFF1B0" stroke-width="2" opacity=".8"/>
    <g fill="none" stroke="#7A5A10" stroke-width="2" stroke-linecap="round" opacity=".75">
      <path d="M256 410L230 388M256 410L282 388"/>
      <path d="M256 380L224 356M256 380L288 356"/>
      <path d="M256 350L220 326M256 350L292 326"/>
      <path d="M256 320L220 296M256 320L292 296"/>
      <path d="M256 290L224 268M256 290L288 268"/>
      <path d="M256 262L234 242M256 262L278 242"/>
    </g>
    <path d="M256 215V458" stroke="#FFF1B0" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M256 215V458" stroke="#fff" stroke-width="1" opacity=".6" transform="translate(-1 0)"/>
  </g>
</svg>
